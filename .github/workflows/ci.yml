---
name: CI
'on':
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ds-zero-to-one
        shell: bash -l {0}         # 👈 ensure conda activation is visible to steps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Miniforge (conda-forge first) + mamba solver
      - name: Set up Miniconda (conda-forge, strict) 
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: false
          conda-remove-defaults: true  # remove implicit 'defaults'
          channels: conda-forge        # explicit default channel
          channel-priority: strict     # strict priority (CI-side)
          environment-file: ds-zero-to-one/environment.yml
          activate-environment: ds

      - name: Sanity check imports 
        run: |
          conda info
          which python
          python -c "import sys; print(sys.version)"
          python -c "import numpy, pandas, seaborn, plotly, duckdb; import polars as pl; print('CI env OK')"
